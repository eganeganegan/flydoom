[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flydoom"
version = "0.1.0"
description = "Connectome-constrained neural controllers for reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "torch>=2.5",
  "gymnasium>=1.0",
  "PyYAML>=6.0",
  "matplotlib>=3.9",
  "networkx>=3.4",
  "scipy>=1.14",
]

[project.optional-dependencies]
doom = ["vizdoom>=1.2.4"]
data = ["h5py>=3.12", "neuprint-python>=0.6.3"]
viz = ["pyvista>=0.46", "imageio>=2.37", "imageio-ffmpeg>=0.6"]
all = [
  "vizdoom>=1.2.4",
  "h5py>=3.12",
  "neuprint-python>=0.6.3",
  "pyvista>=0.46",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "tensorboard>=2.18",
]
tracking = ["tensorboard>=2.18"]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
