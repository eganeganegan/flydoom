experiment:
  name: flydoom_basic
  variants: [real_connectome, erdos_renyi, degree_rewired, mlp, gru, lstm]
  evaluation_episodes: 20
training:
  total_steps: 20000
  rollout_steps: 128
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  epochs: 4
  batch_size: 64
env:
  backend: mock
  size: 42
  max_episode_steps: 96
output:
  root: outputs
  tensorboard: false
  record_activity: true
